services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      # the image is distroless, so there is no shell or curl
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      retries: 60

  dvwa:
    image: ghcr.io/digininja/dvwa@sha256:8029450682bd70e2e8cd1ffe8e46dd1885ff2a913296091cebfa8ba0a7d36498
    environment:
      - DB_SERVER=db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:4280:80
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1/login.php"]
      interval: 2s
      retries: 60

  db:
    image: mariadb:11.8
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  wordpress:
    image: wordpress:7.1.5-php8.4-apache
    environment:
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
      # build links from the request host, so they point back through the bench proxy
      - WORDPRESS_CONFIG_EXTRA=define('WP_HOME', 'http://' . ($$_SERVER['HTTP_HOST'] ?? '127.0.0.1:8081')); define('WP_SITEURL', WP_HOME);
    depends_on:
      wordpress-db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
    ports:
      - 127.0.0.1:8081:80
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1/wp-login.php"]
      interval: 2s
      retries: 60

  wordpress-db:
    image: mariadb:11.8
    environment:
      - MYSQL_ROOT_PASSWORD=wordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  wp-cli:
    image: wordpress:cli-2.12.0-php8.4
    profiles: [setup]
    user: "33:33"
    environment:
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  wordpress:
